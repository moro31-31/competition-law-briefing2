name: Daily Competition Law Briefing

on:
  schedule:
    # Runs at 06:45 UTC (07:45 CET) Monday through Friday
    - cron: '45 6 * * 1-5'
  workflow_dispatch: # Allows you to trigger a test run manually with one click

jobs:
  send-briefing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Hydrogen Briefing Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python briefing_agent.py
